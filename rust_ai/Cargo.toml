[package]
name = "rust_ai_2048"
version = "0.1.0"
edition = "2021"

[lib]
name = "rust_ai_2048"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
rustc-hash = "1.1"
lazy_static = "1.4"
rayon = "1.7"
parking_lot = "0.12"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
